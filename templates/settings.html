{% extends "base.html" %}
{% block content %}
{% include "navbar.html" %}
<div class="container" id="settings">
    <div id="settings-heading">
        <a href="{{ url_for('chatroom') }}">
            <img
                src="/static/images/svg/back.svg"
                alt="logout icon"
                class="icon"
            >
        </a>
        <div class="typing-container">
            <h1 class="typing-header">Settings</h1>
        </div>
    </div>
    <div id="settings-body">
        <!-- <div class="popup-container">
            <div class="nav-item">
                <div class="selected-nav-item"></div>
                <h2>Account Deletion</h2>
            </div>
        </div> -->
        <div class="popup-container" id="delete-account">
            <img
                id="chat-icon"
                src="/static/images/svg/delete_account.svg"
                alt="chat icon"
            >
            <div>
                <b><h2>Delete Account</h2></b>
                <p>
                    Permenantly delete your account.
                    This action is irreversable.
                </p>
            </div>
            <button
                class="warning-btn popup-btn open-modal-btn"
                type="button"
            >
                Delete Account
            </button>
        </div>
    </div>
    <div class="modal-wrapper" style="display: none;">
        <div class="modal">
            <div style="flex-direction: column;">
                <p class="x">X</p>
                <img src="/static/images/svg/warning.svg" alt="!">
                <h2>Are you sure?</h2>
                <p>Once you delete your account it cannot be recovered</p>
            </div>
            <div>
                <button
                    class="close-btn secondary-btn popup-btn"
                    type="button"
                >
                    Cancel
                </button>
                <form
                    method="POST"
                    action="{{ url_for('delete_account') }}"
                >
                    {{ form.hidden_tag() }}
                    {{ form.delete }}
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const modalWrapper = document.querySelector(".modal-wrapper");

    const openModalBtn = document.querySelector(".open-modal-btn");
    openModalBtn.addEventListener("click", () => {
        modalWrapper.style.display = "flex";
    });

    const closeModalX = document.querySelector(".modal .x");
    closeModalX.addEventListener("click", () => {
        modalWrapper.style.display = "none";
    });

    const closeModalBtn = document.querySelector(".modal .close-btn");
    closeModalBtn.addEventListener("click", () => {
        modalWrapper.style.display = "none";
    });

    modalWrapper.addEventListener("click", (event) => {
        if (event.target === modalWrapper) {
            modalWrapper.style.display = "none";
        }
    });
</script>
{% endblock %}

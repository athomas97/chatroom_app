{% extends "base.html" %}
{% block content %}
<div class="container" id="room">
    <div class="message-box">
        <div class="room-header">
            <h2>Chatroom ({{ code }})</h2>
            <a class="leave-room" href="{{ url_for('chatroom') }}">
                <img
                    class="icon"
                    src="/static/images/svg/leave_room.svg"
                    alt=""
                >
                <h2>Leave Room</h2>
            </a>
        </div>
        <div id="messages-container">
            <div
                class="messages"
                id="messages"
                data-username="{{ current_user.username }}"
            ></div>
        </div>
        <div id="user-is-typing" aria-live="polite"></div>
        <div class="inputs">
            <input
                type="text"
                rows="3"
                placeholder="Message"
                name="message"
                id="message"
            />
            <button
                class="primary-btn"
                type="button"
                name="send"
                id="send-btn"
                onClick="sendMessage()"
            >
                Send
            </button>
        </div>
    </div>
</div>
<script type="text/javascript">
    const socketio = io();
    const messages = document.getElementById("messages");
    const currentUsername = messages.dataset.username;
    const messagesContainer = document.getElementById("messages-container");
    const typingIndicator = document.getElementById("user-is-typing");
    const messageInput = document.getElementById("message");
    const typingUsers = new Map();
    let lastMessageSender = null;
    let typingTimer;

    const scrollChatToBottom = () => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    };

    // Typing indicator
    const updateTypingIndicator = () => {
        const names = Array.from(typingUsers.keys());
        const visibleNames = names.slice(0, 5);
        const hasOtherUsers = names.length > visibleNames.length;

        typingIndicator.replaceChildren();
        typingIndicator.style.visibility = names.length ? "visible" : "hidden";
        if (!names.length) return;

        const nameLabel = document.createElement("strong");
        nameLabel.textContent = visibleNames.join(", ") +
            (hasOtherUsers ? ", and others" : "");
        typingIndicator.append(
            nameLabel,
            document.createTextNode(names.length === 1
                ? " is typing..."
                : " are typing...")
        );
    };

    const stopTyping = (name) => {
        if (!typingUsers.has(name)) return;

        clearTimeout(typingUsers.get(name));
        typingUsers.delete(name);
        updateTypingIndicator();
    };

    // Message rendering
    const createMessage = (name, msg) => {
        stopTyping(name);
        const isReceived = name !== currentUsername;
        const isSystemNotice =
            msg === "has entered the room" ||
            msg === "has left the room";

        if (
            isReceived &&
            !isSystemNotice &&
            name !== lastMessageSender
        ) {
            const senderLabel = document.createElement("strong");
            senderLabel.className = "message-sender";
            senderLabel.textContent = name;
            messages.appendChild(senderLabel);
        }

        const bubble = document.createElement("div");
        if (isSystemNotice) {
            bubble.className = "user-status";
            const leftRule = document.createElement("hr");
            const notice = document.createElement("span");
            const sender = document.createElement("strong");
            const status = document.createElement("em");
            const rightRule = document.createElement("hr");
            sender.textContent = name;
            status.textContent = msg === "has entered the room"
                ? " has entered the room"
                : " has left the room";

            notice.append(sender, status);
            bubble.append(leftRule, notice, rightRule);
        } else {
            bubble.className = `${
                isReceived ? "text-bubble-recieved" : "text-bubble-sent"
            }`;

            const messageText = document.createElement("span");
            messageText.textContent = msg;
            bubble.appendChild(messageText);
        }
        messages.appendChild(bubble);
        lastMessageSender = isSystemNotice ? null : name;
        scrollChatToBottom();
    };

    socketio.on("message", (data) => {
        createMessage(data.name, data.message);
    });

    // Sending messages
    const sendMessage = () => {
        if (messageInput.value === "") return;
        socketio.emit("message", { data: messageInput.value });
        messageInput.value = "";
    };

    // Typing state sent to and received from the server
    messageInput.addEventListener("input", () => {
        const isTyping = messageInput.value.trim().length > 0;
        socketio.emit("typing", { is_typing: isTyping });

        clearTimeout(typingTimer);
        if (isTyping) {
            typingTimer = setTimeout(() => {
                socketio.emit("typing", { is_typing: false });
            }, 1000);
        }
    });

    messageInput.addEventListener("blur", () => {
        clearTimeout(typingTimer);
        socketio.emit("typing", { is_typing: false });
    });

    socketio.on("typing", ({ name, is_typing }) => {
        if (is_typing) {
            clearTimeout(typingUsers.get(name));
            typingUsers.set(name, setTimeout(() => stopTyping(name), 2000));
            updateTypingIndicator();
        } else {
            stopTyping(name);
        }
    });
</script>
{% for msg in messages %}
    <script type="text/javascript">
        createMessage("{{ msg.name }}", "{{ msg.message }}");
    </script>
{% endfor %}
{% endblock %}

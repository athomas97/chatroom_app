{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h1>Register Page</h1>
    <form method="POST" action="">
        {{ form.hidden_tag() }}
        {{ form.username }}
        {{ form.password }}
        {{ form.submit }}
    </form>
    <a href="{{ url_for('login') }}">Already have an account? Log in here</a><br>
</div>
{% endblock %}

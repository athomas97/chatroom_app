{% extends "base.html" %}
{% block content %}
{% include "navbar.html" %}
<form method="post" class="container">
    <div id="join-room">
        <h2 class="header">Join a chatroom...</h2>
        <div class="text-bubble">
            <div class="bubble-shadow">
                <div class="bubble-silhouette">
                    <div class="triangle"></div>
                </div>
            </div>
            <div class="join-room-input">
                <input
                    type="text"
                    placeholder="Enter Room Code"
                    name="code"
                    value="{{ code }}"
                    maxlength="4"
                />
                <button type="submit" name="join">
                    <h1>+</h1>
                </button>
            </div>
        </div>
    </div>
    <div id="create-room">
        <h2 class="header">or...</h2>
        <button class="text-bubble" type="submit" name="create">
            <div class="bubble-shadow">
                <div class="bubble-silhouette">
                    <div class="triangle"></div>
                </div>
            </div>
            <h2>Create a Room</h2>
        </button>
    </div>
    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
</form>
{% endblock %}
